name: cosoremi-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cosoremi
      POSTGRES_USER: cosoremi
      # Local-only credentials; PostgreSQL has no published host port.
      POSTGRES_PASSWORD: cosoremi_dev_only
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - '5432'

  app:
    image: cosoremi-portal:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://cosoremi:cosoremi_dev_only@postgres:5432/cosoremi
      SESSION_SECRET: ${DEV_SESSION_SECRET:-cosoremi-development-only-session-secret-32-chars}
      APP_URL: http://localhost:${DEV_PORT:-3000}
      TRUST_PROXY: '0'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    ports:
      - '127.0.0.1:${DEV_PORT:-3000}:3000'
      - '127.0.0.1:${STUDIO_PORT:-5555}:5555'
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - uploads_dev:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres_dev_data:
  node_modules_dev:
  uploads_dev:
